<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilgrim's Temple</title>
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-monospace); min-height: 100vh; }
  body { display: flex; justify-content: center; align-items: flex-start; }
  .page { width: fit-content; max-width: 100vw; }
  #game { white-space: pre; line-height: var(--map-line-height); padding: 16px 16px 0 16px; }
  .status { color: var(--gold); font-size: 14px; padding: 8px 16px; font-family: var(--font-monospace); white-space: pre; }
  #log { color: var(--gray-1); font-family: var(--font-monospace); white-space: pre; padding: 4px 16px 0 16px; line-height: 1.15; }
  #hints { color: var(--gray-2); font-family: var(--font-monospace); padding: 8px 16px 16px 16px; white-space: pre-wrap; }
  .shell-controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 16px; border-top:1px solid var(--gray-3); border-bottom:1px solid var(--gray-3); background: var(--bg); font-size:12px; }
  .shell-controls label { color: var(--gray-1); }
  .shell-controls input[type=file] { color: var(--fg); font-family: var(--font-monospace); font-size:12px; }
  .shell-controls button { font-family: var(--font-monospace); font-size:12px; background: var(--gray-3); color: var(--fg); border:1px solid var(--gray-2); padding:4px 8px; cursor:pointer; }
  .shell-controls button:hover { background: var(--gray-2); color: var(--bg); }
  #editor { display:none; padding:12px 16px; border-bottom:1px solid var(--gray-3); background: var(--bg); }
  #editor.open { display:block; }
  #editor textarea { width:100%; max-width:640px; min-height:160px; background:#1a1816; color:var(--fg); border:1px solid var(--gray-3); font-family: var(--font-monospace); font-size:12px; padding:8px; }
  #editor select, #editor button { font-family: var(--font-monospace); font-size:12px; }
  #editStatus { color: var(--gold); font-size:12px; margin-left:8px; }
</style>
</head>
<body>
<div class="page">
<div class="shell-controls" id="shell-controls">
  <label for="dataZip">Data zip:</label>
  <input type="file" id="dataZip" accept=".zip">
  <button id="resetData" type="button">Reset Data</button>
  <button id="toggleEditor" type="button">Data Editor</button>
  <span id="shellStatus" style="color:var(--gray-1);"></span>
</div>
<div id="editor">
  <div style="margin-bottom:6px;">
    <label for="editSelect" style="color:var(--gray-1);">File:</label>
    <select id="editSelect">
      <option value="tuning.json">tuning.json</option>
      <option value="features.json">features.json</option>
      <option value="enemies.json">enemies.json</option>
      <option value="floorThemes.json">floorThemes.json</option>
      <option value="world.json">world.json</option>
      <option value="merchants.json">merchants.json</option>
      <option value="fountains.json">fountains.json</option>
    </select>
    <button id="editLoad" type="button">Load</button>
    <button id="editSave" type="button">Save to overlay</button>
    <span id="editStatus"></span>
  </div>
  <textarea id="editArea" rows="14" cols="70" spellcheck="false" placeholder="JSON will appear here…"></textarea>
  <div style="color:var(--gray-2); font-size:11px; margin-top:4px;">Edits are stored in localStorage overlay (data:&lt;name&gt;) and take effect after reload. Use Reset Data to restore embedded defaults.</div>
</div>
<div id="game">Loading Pilgrim's Temple…</div>
<div class="status" id="status">Booting WASM…</div>
<div id="log"></div>
<div id="hints"></div>
</div>
<script src="wasm_exec.js"></script>
<script>
(function() {
  const status = document.getElementById('status');
  function supportsBr() {
    if (!('DecompressionStream' in window)) return false;
    try { new DecompressionStream('br'); return true; } catch (e) { return false; }
  }
  async function instantiateWasm(bytes, go) {
    const result = await WebAssembly.instantiate(bytes, go.importObject);
    go.run(result.instance);
  }
  async function loadWasm() {
    // Prefer brotli if supported, else go straight to uncompressed.
    if (supportsBr()) {
      try {
        const resp = await fetch('main.wasm.br');
        if (!resp.ok) throw new Error('fetch main.wasm.br: ' + resp.status);
        const brBytes = await resp.arrayBuffer();
        const ds = new DecompressionStream('br');
        const stream = new Response(brBytes).body.pipeThrough(ds);
        const wasmBytes = await new Response(stream).arrayBuffer();
        status.textContent = 'Running (brotli)…';
        const go = new Go();
        await instantiateWasm(wasmBytes, go);
        return;
      } catch (e) {
        console.warn('brotli load failed, falling back to main.wasm:', e);
        status.textContent = 'Brotli unsupported — loading uncompressed…';
      }
    } else {
      status.textContent = 'Brotli not supported — loading uncompressed…';
    }
    // Fallback: uncompressed
    const resp2 = await fetch('main.wasm');
    if (!resp2.ok) throw new Error('fetch main.wasm: ' + resp2.status);
    const wasmBytes2 = await resp2.arrayBuffer();
    const go2 = new Go();
    await instantiateWasm(wasmBytes2, go2);
  }
  loadWasm().catch(e => {
    status.textContent = 'Load failed: ' + e;
    console.error(e);
  });
})();
</script>
</body>
</html>
