<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilgrim's Temple</title>
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-monospace); }
  #game { white-space: pre; line-height: var(--map-line-height); padding: 16px 16px 0 16px; }
  .status { color: var(--gold); font-size: 14px; padding: 8px 16px; font-family: var(--font-monospace); white-space: pre; }
  #log { color: var(--gray-1); font-family: var(--font-monospace); white-space: pre; padding: 4px 16px 0 16px; line-height: 1.15; }
  #hints { color: var(--gray-2); font-family: var(--font-monospace); padding: 8px 16px 16px 16px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="game">Loading Pilgrim's Temple…</div>
<div class="status" id="status">Booting WASM…</div>
<div id="log"></div>
<div id="hints"></div>
<script src="wasm_exec.js"></script>
<script>
(function() {
  const status = document.getElementById('status');
  function supportsBr() {
    if (!('DecompressionStream' in window)) return false;
    try { new DecompressionStream('br'); return true; } catch (e) { return false; }
  }
  async function instantiateWasm(bytes, go) {
    const result = await WebAssembly.instantiate(bytes, go.importObject);
    go.run(result.instance);
  }
  async function loadWasm() {
    // Prefer brotli if supported, else go straight to uncompressed.
    if (supportsBr()) {
      try {
        const resp = await fetch('main.wasm.br');
        if (!resp.ok) throw new Error('fetch main.wasm.br: ' + resp.status);
        const brBytes = await resp.arrayBuffer();
        const ds = new DecompressionStream('br');
        const stream = new Response(brBytes).body.pipeThrough(ds);
        const wasmBytes = await new Response(stream).arrayBuffer();
        status.textContent = 'Running (brotli)…';
        const go = new Go();
        await instantiateWasm(wasmBytes, go);
        return;
      } catch (e) {
        console.warn('brotli load failed, falling back to main.wasm:', e);
        status.textContent = 'Brotli unsupported — loading uncompressed…';
      }
    } else {
      status.textContent = 'Brotli not supported — loading uncompressed…';
    }
    // Fallback: uncompressed
    const resp2 = await fetch('main.wasm');
    if (!resp2.ok) throw new Error('fetch main.wasm: ' + resp2.status);
    const wasmBytes2 = await resp2.arrayBuffer();
    const go2 = new Go();
    await instantiateWasm(wasmBytes2, go2);
  }
  loadWasm().catch(e => {
    status.textContent = 'Load failed: ' + e;
    console.error(e);
  });
})();
</script>
</body>
</html>
